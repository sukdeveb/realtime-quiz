<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Host Control Panel</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    .card { background: #f4f4f9; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    button { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 5px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .success { background: #28a745; }
    .danger { background: #dc3545; }
  </style>
</head>
<body>
  <h2>🎯 Host Control Panel</h2>

  <div class="card">
    <h3 id="statusText">Quiz Ready</h3>
    <button id="startQuizBtn" class="success">🚀 Start Full Quiz</button>
    <button id="nextQBtn" disabled>▶️ Next Question</button>
  </div>

  <div class="card">
    <button id="resetBtn" class="danger">🔄 Reset Game & Scores</button>
  </div>

  <script type="module">
    import { db, ref, set } from './firebase-config.js';

    // Define all your quiz questions here
    const quizQuestions = [
      {
        text: "Question 1: What is the capital of France?",
        options: ["London", "Berlin", "Paris", "Madrid"],
        correctIndex: 2,
        duration: 30
      },
      {
        text: "Question 2: Which planet is known as the Red Planet?",
        options: ["Jupiter", "Mars", "Venus", "Saturn"],
        correctIndex: 1,
        duration: 30
      },
      {
        text: "Question 3: What is the chemical symbol for Gold?",
        options: ["Au", "Ag", "Fe", "Hg"],
        correctIndex: 0,
        duration: 20
      }
    ];

    let currentQuestionIndex = -1;

    const startBtn = document.getElementById('startQuizBtn');
    const nextBtn = document.getElementById('nextQBtn');
    const statusText = document.getElementById('statusText');

    // Start Quiz from Question 1
    startBtn.addEventListener('click', () => {
      currentQuestionIndex = 0;
      publishQuestion();
      startBtn.disabled = true;
      nextBtn.disabled = false;
    });

    // Advance to next question
    nextBtn.addEventListener('click', () => {
      if (currentQuestionIndex < quizQuestions.length - 1) {
        currentQuestionIndex++;
        publishQuestion();
      } else {
        // End Quiz
        set(ref(db, 'gameState'), { status: 'FINISHED' });
        statusText.innerText = "🏆 Quiz Completed!";
        nextBtn.disabled = true;
      }
    });

    function publishQuestion() {
      const q = quizQuestions[currentQuestionIndex];
      statusText.innerText = `Active: Question ${currentQuestionIndex + 1} of ${quizQuestions.length}`;

      set(ref(db, 'gameState'), {
        status: 'ACTIVE',
        questionIndex: currentQuestionIndex,
        totalQuestions: quizQuestions.length,
        text: q.text,
        options: q.options,
        correctIndex: q.correctIndex,
        duration: q.duration,
        startTimestamp: Date.now()
      });
    }

    // Reset whole game
    document.getElementById('resetBtn').addEventListener('click', () => {
      currentQuestionIndex = -1;
      set(ref(db, 'gameState'), null);
      set(ref(db, 'players'), null);
      statusText.innerText = "Quiz Reset";
      startBtn.disabled = false;
      nextBtn.disabled = true;
      alert('Quiz and players reset!');
    });
  </script>
</body>
</html>
