<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agricultural Machinery & Power Engineering Quiz</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; max-width: 650px; margin: auto; background-color: #f9f9f9; }
    .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .btn { display: block; width: 100%; padding: 14px; margin: 10px 0; font-size: 16px; border: 1px solid #28a745; background: #28a745; color: white; border-radius: 8px; cursor: pointer; text-align: left; transition: background 0.2s; }
    .btn:hover { background: #218838; }
    .btn:active { background: #1e7e34; }
    
    .skip-btn { background: #6c757d; border: 1px solid #6c757d; color: white; font-weight: bold; width: 100%; padding: 12px; margin-top: 15px; border-radius: 8px; cursor: pointer; text-align: center; font-size: 15px; transition: background 0.2s; }
    .skip-btn:hover { background: #5a6268; }

    #timer { font-size: 22px; font-weight: bold; color: #d9534f; margin: 10px 0; }
    #progress { font-size: 16px; font-weight: bold; color: #555; margin-bottom: 10px; }
    input { width: 85%; padding: 12px; font-size: 16px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; }
    h2 { color: #333; line-height: 1.4; font-size: 1.15rem; text-align: left; }
    #playerBadge { font-weight: bold; color: #007bff; text-align: left; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>🚜 Agricultural Engineering Quiz</h1>

  <div class="card">
    <!-- MANDATORY NICKNAME SECTION -->
    <div id="join-section">
      <h3>Enter Your Nickname to Start</h3>
      <input type="text" id="username" placeholder="Type Nickname Here..." required />
      <button class="btn" id="joinBtn" style="text-align:center;">Join Quiz</button>
    </div>

    <!-- QUIZ SECTION -->
    <div id="quiz-section" style="display:none;">
      <div id="playerBadge"></div>
      <div id="progress"></div>
      <div id="timer"></div>
      <h2 id="questionText"></h2>
      <div id="optionsContainer"></div>
      
      <!-- SKIP BUTTON AT THE BOTTOM -->
      <button id="skipBtn" class="skip-btn">⏭ Skip Question</button>
    </div>
  </div>

  <script type="module">
    import { db, ref, onValue, set, update } from './firebase-config.js';
    import { quizQuestions } from './questions.js';

    let playerId = null;
    let playerName = "";
    let playerQuestions = []; // Shuffled questions unique to each player
    let currentQuestionIdx = 0;
    let questionsAnsweredCount = 0;
    let correctAnswersCount = 0;
    let totalTimeTaken = 0;
    let questionStartTimestamp = 0;
    let timerInterval = null;
    let gameIsOpen = false;

    // Clear previous session memory on fresh page load
    localStorage.removeItem('quiz_player_id');
    localStorage.removeItem('quiz_player_name');

    // Fisher-Yates Shuffle Algorithm
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    document.getElementById('joinBtn').addEventListener('click', () => {
      const name = document.getElementById('username').value.trim();
      
      if (!name) {
        alert('Nickname is mandatory! Please enter your name to join.');
        return;
      }

      playerId = 'player_' + Math.random().toString(36).substring(2, 9);
      playerName = name;

      // Create a unique randomized question order for this player
      playerQuestions = shuffleArray(quizQuestions);

      // Register new player in Firebase
      set(ref(db, `players/${playerId}`), { 
        name: playerName, 
        questionsAnswered: 0,
        correctAnswers: 0,
        totalTime: 0
      });

      document.getElementById('join-section').style.display = 'none';
      document.getElementById('quiz-section').style.display = 'block';
      document.getElementById('playerBadge').innerText = `Player: ${playerName}`;

      initGameListener();
    });

    // Skip Button Handler
    document.getElementById('skipBtn').addEventListener('click', () => {
      if (!gameIsOpen || currentQuestionIdx >= playerQuestions.length) return;

      clearInterval(timerInterval);
      const q = playerQuestions[currentQuestionIdx];
      
      // Log full question duration as time taken for skipped question
      totalTimeTaken += q.duration;
      questionsAnsweredCount += 1;

      syncStatsToFirebase();

      currentQuestionIdx++;
      loadNextQuestion();
    });

    function initGameListener() {
      onValue(ref(db, 'gameState'), (snapshot) => {
        const state = snapshot.val();

        if (!state || state.status !== 'OPEN') {
          gameIsOpen = false;
          clearInterval(timerInterval);
          document.getElementById('questionText').innerText = "Waiting for the Host to open the quiz session...";
          document.getElementById('optionsContainer').innerHTML = '';
          document.getElementById('timer').innerText = '';
          document.getElementById('progress').innerText = '';
          document.getElementById('skipBtn').style.display = 'none';
          currentQuestionIdx = 0;
          questionsAnsweredCount = 0;
          correctAnswersCount = 0;
          totalTimeTaken = 0;
          return;
        }

        if (!gameIsOpen) {
          gameIsOpen = true;
          document.getElementById('skipBtn').style.display = 'block';
          currentQuestionIdx = 0;
          questionsAnsweredCount = 0;
          correctAnswersCount = 0;
          totalTimeTaken = 0;
          loadNextQuestion();
        }
      });
    }

    function loadNextQuestion() {
      clearInterval(timerInterval);

      if (currentQuestionIdx >= playerQuestions.length) {
        document.getElementById('questionText').innerText = "🎉 Quiz Completed! Check the Live Leaderboard for final results.";
        document.getElementById('optionsContainer').innerHTML = '';
        document.getElementById('timer').innerText = '';
        document.getElementById('progress').innerText = '';
        document.getElementById('skipBtn').style.display = 'none';
        return;
      }

      const q = playerQuestions[currentQuestionIdx];
      questionStartTimestamp = Date.now();

      // Clean prefix if any exists
      const cleanQuestionText = q.text.replace(/^Question\s+\d+[:\.-]?\s*/i, '');

      document.getElementById('progress').innerText = `Question ${currentQuestionIdx + 1} of ${playerQuestions.length}`;
      document.getElementById('questionText').innerText = cleanQuestionText;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      // Shuffle options randomly
      const optionsWithCorrectness = q.options.map((optText, idx) => ({
        text: optText,
        isCorrect: idx === q.correctIndex
      }));

      const shuffledOptions = shuffleArray(optionsWithCorrectness);

      shuffledOptions.forEach((optObj) => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = optObj.text;
        btn.onclick = () => submitAnswer(optObj.isCorrect);
        container.appendChild(btn);
      });

      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - questionStartTimestamp) / 1000);
        const remaining = q.duration - elapsed;

        if (remaining <= 0) {
          clearInterval(timerInterval);
          totalTimeTaken += q.duration;
          questionsAnsweredCount += 1;
          syncStatsToFirebase();
          currentQuestionIdx++;
          loadNextQuestion();
        } else {
          document.getElementById('timer').innerText = `⏱ Time Remaining: ${remaining}s`;
        }
      }, 200);
    }

    function submitAnswer(isCorrect) {
      clearInterval(timerInterval);

      const q = playerQuestions[currentQuestionIdx];
      const timeTaken = Math.min(q.duration, (Date.now() - questionStartTimestamp) / 1000);
      
      totalTimeTaken += timeTaken;
      questionsAnsweredCount += 1;

      if (isCorrect) {
        correctAnswersCount += 1;
      }

      syncStatsToFirebase();

      currentQuestionIdx++;
      loadNextQuestion();
    }

    function syncStatsToFirebase() {
      update(ref(db, `players/${playerId}`), { 
        questionsAnswered: questionsAnsweredCount,
        correctAnswers: correctAnswersCount,
        totalTime: Number(totalTimeTaken.toFixed(2))
      });
    }
  </script>
</body>
</html>
