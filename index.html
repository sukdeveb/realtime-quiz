<script type="module">
  import { db, ref, onValue, set, update } from './firebase-config.js';
  import { quizQuestions } from './questions.js'; // Imports all 200 questions dynamically

  let playerId = null;
  let playerName = "";
  let currentQuestionIdx = 0;
  let questionsAnsweredCount = 0;
  let correctAnswersCount = 0;
  let totalTimeTaken = 0;
  let questionStartTimestamp = 0;
  let timerInterval = null;
  let gameIsOpen = false;

  // Clear previous session memory on fresh page load
  localStorage.removeItem('quiz_player_id');
  localStorage.removeItem('quiz_player_name');

  document.getElementById('joinBtn').addEventListener('click', () => {
    const name = document.getElementById('username').value.trim();
    
    if (!name) {
      alert('Nickname is mandatory! Please enter a name to join.');
      return;
    }

    playerId = 'player_' + Math.random().toString(36).substring(2, 9);
    playerName = name;

    set(ref(db, `players/${playerId}`), { 
      name: playerName, 
      questionsAnswered: 0,
      correctAnswers: 0,
      totalTime: 0
    });

    document.getElementById('join-section').style.display = 'none';
    document.getElementById('quiz-section').style.display = 'block';
    document.getElementById('playerBadge').innerText = `Player: ${playerName}`;

    initGameListener();
  });

  function initGameListener() {
    onValue(ref(db, 'gameState'), (snapshot) => {
      const state = snapshot.val();

      if (!state || state.status !== 'OPEN') {
        gameIsOpen = false;
        clearInterval(timerInterval);
        document.getElementById('questionText').innerText = "Waiting for Host to start the quiz...";
        document.getElementById('optionsContainer').innerHTML = '';
        document.getElementById('timer').innerText = '';
        document.getElementById('progress').innerText = '';
        currentQuestionIdx = 0;
        questionsAnsweredCount = 0;
        correctAnswersCount = 0;
        totalTimeTaken = 0;
        return;
      }

      if (!gameIsOpen) {
        gameIsOpen = true;
        currentQuestionIdx = 0;
        questionsAnsweredCount = 0;
        correctAnswersCount = 0;
        totalTimeTaken = 0;
        loadNextQuestion();
      }
    });
  }

  function loadNextQuestion() {
    clearInterval(timerInterval);

    if (currentQuestionIdx >= quizQuestions.length) {
      document.getElementById('questionText').innerText = "🎉 Quiz Completed! Check the Leaderboard.";
      document.getElementById('optionsContainer').innerHTML = '';
      document.getElementById('timer').innerText = '';
      document.getElementById('progress').innerText = '';
      return;
    }

    const q = quizQuestions[currentQuestionIdx];
    questionStartTimestamp = Date.now();

    document.getElementById('progress').innerText = `Question ${currentQuestionIdx + 1} of ${quizQuestions.length}`;
    document.getElementById('questionText').innerText = q.text;

    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';

    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.innerText = opt;
      btn.onclick = () => submitAnswer(idx);
      container.appendChild(btn);
    });

    timerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - questionStartTimestamp) / 1000);
      const remaining = q.duration - elapsed;

      if (remaining <= 0) {
        clearInterval(timerInterval);
        totalTimeTaken += q.duration;
        questionsAnsweredCount += 1;
        syncStatsToFirebase();
        currentQuestionIdx++;
        loadNextQuestion();
      } else {
        document.getElementById('timer').innerText = `⏱ Time Remaining: ${remaining}s`;
      }
    }, 200);
  }

  function submitAnswer(chosenIdx) {
    clearInterval(timerInterval);

    const q = quizQuestions[currentQuestionIdx];
    const timeTaken = Math.min(q.duration, (Date.now() - questionStartTimestamp) / 1000);
    
    totalTimeTaken += timeTaken;
    questionsAnsweredCount += 1;

    if (chosenIdx === q.correctIndex) {
      correctAnswersCount += 1;
    }

    syncStatsToFirebase();

    currentQuestionIdx++;
    loadNextQuestion();
  }

  function syncStatsToFirebase() {
    update(ref(db, `players/${playerId}`), { 
      questionsAnswered: questionsAnsweredCount,
      correctAnswers: correctAnswersCount,
      totalTime: Number(totalTimeTaken.toFixed(2))
    });
  }
</script>
