<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Quiz Player</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; max-width: 500px; margin: auto; }
    .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border: none; background: #28a745; color: white; border-radius: 8px; cursor: pointer; }
    #timer { font-size: 22px; font-weight: bold; color: #d9534f; margin: 15px 0; }
    input { width: 80%; padding: 12px; font-size: 16px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>🎮 Live Quiz</h1>

  <div id="join-section">
    <h3>Enter Your Nickname</h3>
    <input type="text" id="username" placeholder="Your Name" />
    <button class="btn" id="joinBtn">Join Quiz</button>
  </div>

  <div id="quiz-section" style="display:none;">
    <div id="progress"></div>
    <div id="timer"></div>
    <h2 id="questionText"></h2>
    <div id="optionsContainer"></div>
  </div>

  <script type="module">
    import { db, ref, onValue, set, update } from './firebase-config.js';

    // Questions list (Each question has its own time limit)
    const quizQuestions = [
      {
        text: "Question 1: What is the capital of France?",
        options: ["London", "Berlin", "Paris", "Madrid"],
        correctIndex: 2,
        duration: 20
      },
      {
        text: "Question 2: Which planet is known as the Red Planet?",
        options: ["Jupiter", "Mars", "Venus", "Saturn"],
        correctIndex: 1,
        duration: 20
      },
      {
        text: "Question 3: What is the chemical symbol for Gold?",
        options: ["Au", "Ag", "Fe", "Hg"],
        correctIndex: 0,
        duration: 15
      }
    ];

    let playerId = localStorage.getItem('quiz_player_id');
    let playerName = localStorage.getItem('quiz_player_name');
    let currentQuestionIdx = 0;
    let questionStartTimestamp = 0;
    let timerInterval = null;
    let gameIsOpen = false;

    if (playerId && playerName) {
      showQuizScreen();
    }

    document.getElementById('joinBtn').addEventListener('click', () => {
      const name = document.getElementById('username').value.trim();
      if (!name) return alert('Please enter a name');
      
      playerId = 'player_' + Math.random().toString(36).substring(2, 9);
      playerName = name;
      localStorage.setItem('quiz_player_id', playerId);
      localStorage.setItem('quiz_player_name', playerName);

      set(ref(db, `players/${playerId}`), { name: playerName, score: 0 });
      showQuizScreen();
    });

    function showQuizScreen() {
      document.getElementById('join-section').style.display = 'none';
      document.getElementById('quiz-section').style.display = 'block';
    }

    // Listen to Host Session State
    onValue(ref(db, 'gameState'), (snapshot) => {
      const state = snapshot.val();

      if (!state || state.status !== 'OPEN') {
        gameIsOpen = false;
        clearInterval(timerInterval);
        document.getElementById('questionText').innerText = "Waiting for the Host to open the quiz...";
        document.getElementById('optionsContainer').innerHTML = '';
        document.getElementById('timer').innerText = '';
        document.getElementById('progress').innerText = '';
        currentQuestionIdx = 0; // Reset player index if host resets
        return;
      }

      if (!gameIsOpen) {
        gameIsOpen = true;
        loadNextQuestion();
      }
    });

    function loadNextQuestion() {
      if (currentQuestionIdx >= quizQuestions.length) {
        // Quiz completed for this specific player
        clearInterval(timerInterval);
        document.getElementById('questionText').innerText = "🎉 You finished the quiz! Check the live dashboard for results.";
        document.getElementById('optionsContainer').innerHTML = '';
        document.getElementById('timer').innerText = '';
        document.getElementById('progress').innerText = '';
        return;
      }

      const q = quizQuestions[currentQuestionIdx];
      questionStartTimestamp = Date.now();

      document.getElementById('progress').innerText = `Question ${currentQuestionIdx + 1} of ${quizQuestions.length}`;
      document.getElementById('questionText').innerText = q.text;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = opt;
        btn.onclick = () => submitAnswer(idx);
        container.appendChild(btn);
      });

      // Individual Question Countdown Timer
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - questionStartTimestamp) / 1000);
        const remaining = q.duration - elapsed;

        if (remaining <= 0) {
          clearInterval(timerInterval);
          // Time expired for this question -> Auto-advance without awarding points
          currentQuestionIdx++;
          loadNextQuestion();
        } else {
          document.getElementById('timer').innerText = `⏱ Time Remaining: ${remaining}s`;
        }
      }, 200);
    }

    function submitAnswer(chosenIdx) {
      clearInterval(timerInterval);

      const q = quizQuestions[currentQuestionIdx];
      const timeTaken = (Date.now() - questionStartTimestamp) / 1000;
      let pointsAwarded = 0;

      if (chosenIdx === q.correctIndex && timeTaken <= q.duration) {
        pointsAwarded = Math.max(100, Math.round(1000 - timeTaken * 25));
      }

      // Add points to player's running score in Firebase
      onValue(ref(db, `players/${playerId}/score`), (snapshot) => {
        const currentScore = snapshot.val() || 0;
        update(ref(db, `players/${playerId}`), {
          score: currentScore + pointsAwarded
        });
      }, { onlyOnce: true });

      // Move directly to the NEXT question immediately for this player
      currentQuestionIdx++;
      loadNextQuestion();
    }
  </script>
</body>
</html>
